name: openaut-poc2

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.2-rootless@sha256:23ccc146e6dc2cd1f5c5435909baae64db873201717f1726490dae649283e6cd
    user: "1000:1000"
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: timescaledb:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD__FILE: /run/secrets/forgejo_db_password
      FORGEJO__server__DOMAIN: forge.openaut.local
      FORGEJO__server__ROOT_URL: http://127.0.0.1:3000/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
    networks:
      - platform
      - admin
    volumes:
      - forgejo_data:/var/lib/gitea
      - ./secrets/forgejo_db_password:/run/secrets/forgejo_db_password:ro
      - forgejo_config:/etc/gitea
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:2222:2222"

networks:
  platform:
    name: openaut-platform-forge-db
    external: true
  admin:

volumes:
  forgejo_data:
  forgejo_config:
